<!doctype html>
<html lang="is" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/png"
      href="/assets/images/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/images/icon.svg" />
    <link rel="shortcut icon" href="/assets/images/icon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/images/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="myntbreyta.is" />
    <link rel="manifest" href="/assets/app.webmanifest" />
    <title>myntbreyta.is</title>
    <style></style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>myntbreyta.is</h1>
      </div>
    </header>

    <main class="container center">
      <h2>Efnið sem þú baðst um er óaðgengilegt</h2>
      <p><a href="/">Fara á forsíðu</a></p>
    </main>

    <script>
      if (window.location.pathname === '/') {
        document.querySelector('main a').style.display = 'none';
      }

      const popularList = [
        'EUR',
        'USD',
        'GBP',
        'SEK',
        'DKK',
        'NOK',
        'AUD',
        'PLN',
        'CHF',
        'CZK',
        'THB',
        'ALL',
      ];
      const path = window.location.pathname.slice(1).toUpperCase();
      const currency = path.slice(0, 3);
      const pathInt = Number.parseInt(path.slice(3));
      const currencyValue = pathInt > 1 ? pathInt : 1;
      if (popularList.includes(currency)) {
        const newUrl = `/#${currency}${currencyValue}`;
        console.log(
          `Invalid URL but matched possible currency coded URL, redirecting to ${newUrl}`,
        );
        window.location.href = newUrl;
      }
    </script>
  </body>
</html>
